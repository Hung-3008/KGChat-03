LLM:
  client: ollama
  model: llama3.2:3b
  temperature: 0.85
  top_p: 1.0
  seed: 42

Gemini:
  model: gemini-2.5-flash
  temperature: 0.85
  top_p: 0.9

Encoder:
  model_name: dmis-lab/biobert-v1.1
  device: cuda

Create:
  Batch_size: 10
  Limit: Null
  Resume: True
  max_parallel_chunks: 4  # Favor chunk-level parallelism; keep models in one process
  max_parallel_files: 1   # Avoid reloading heavy models across processes

Insert:
  Batch_size: 1
  Limit: 100000
  Resume: False

Qdrant:
  timeout: 300 
  search_batch_size: 12  # Limit concurrent Qdrant queries to reduce I/O contention

