LLM:
  client: ollama
  model: llama3.2:3b
  temperature: 0.85
  top_p: 1.0
  seed: 42

Gemini:
  model: gemini-2.5-flash
  temperature: 0.85
  top_p: 0.9

Encoder:
  model_name: dmis-lab/biobert-v1.1
  device: cuda
  batch_size: 96 

Create:
  Batch_size: 10
  Limit: Null
  Resume: True
  max_parallel_chunks: 6
  max_parallel_files: 8   

Insert:
  Batch_size: 1
  Limit: 100000
  Resume: False

Qdrant:
  timeout: 300 
  search_batch_size: 16 
  linker_batch_size: 320 

