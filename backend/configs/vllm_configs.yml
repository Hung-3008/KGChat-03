LLM:
  client: vllm
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  base_url: http://localhost:8000/v1
  temperature: 0.1
  top_p: 0.95
  max_tokens: 4096

Encoder:
  model_name: dmis-lab/biobert-v1.1
  device: cuda

Create:
  Batch_size: 1
  Limit: 1 
  Resume: False 

Insert:
  Batch_size: 1
  Limit: 100000
  Resume: False

Qdrant:
  timeout: 300 
  search_batch_size: 10 
