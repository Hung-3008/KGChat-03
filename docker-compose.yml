services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
    environment:
      # Performance tuning for high concurrent queries
      - QDRANT__SERVICE__MAX_WORKERS=0  # Auto-select based on CPU cores
      - QDRANT__SERVICE__MAX_SEARCH_THREADS=0  # Auto-select for parallel search
      - QDRANT__STORAGE__PERFORMANCE__MAX_OPTIMIZATION_THREADS=8  # Limit background indexing
      - QDRANT__SERVICE__GRPC_PORT=6334  # Enable gRPC for better performance
    deploy:
      resources:
        limits:
          cpus: '8'  # Increase CPU allocation for concurrent processing
          memory: 16G  # Increase memory for caching and concurrent operations
        reservations:
          cpus: '4'
          memory: 8G
    ulimits:
      nofile:
        soft: 65536  # Prevent "too many open files" error
        hard: 65536
